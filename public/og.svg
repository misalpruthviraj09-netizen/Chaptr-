<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="280" fill="#3730A3" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="320" fill="#1E1B4B" opacity="0.3" filter="url(#glow)" />
  <circle cx="600" cy="550" r="200" fill="#2DD4BF" opacity="0.15" filter="url(#glow)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="90" height="90" rx="24" fill="#3730A3" />
    <path d="M25 28a8 8 0 0 1 8-8h32a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H33a8 8 0 0 0-8 8V28z" fill="#FFFFFF" />
    <path d="M33 20a8 8 0 0 0-8 8v48a8 8 0 0 1 8-8h32" stroke="#2DD4BF" stroke-width="5" fill="none" stroke-linecap="round" />
    <circle cx="58" cy="36" r="4.5" fill="#FACC15" />
    
    <text x="110" y="65" font-family="Fredoka, system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
      Chaptr
    </text>
  </g>

  <!-- Headline -->
  <text x="100" y="320" font-family="Fredoka, system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">
    Master non-fiction books.
  </text>
  <text x="100" y="395" font-family="Fredoka, system-ui, sans-serif" font-size="64" font-weight="700" fill="#2DD4BF">
    5-minute missions.
  </text>

  <!-- Pitch / Subtitle -->
  <text x="100" y="470" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
    Interactive 5-minute missions, spaced repetition quizzes, and gamified mastery.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(100, 520)">
    <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="90" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">5-Min Missions</text>
  </g>
  <g transform="translate(300, 520)">
    <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="90" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Spaced Repetition</text>
  </g>
  <g transform="translate(500, 520)">
    <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="90" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Mastery Rings</text>
  </g>
  <g transform="translate(500, 520)">
    <rect width="180" height="42" rx="21" fill="#1E293B" stroke="#334155" />
    <text x="90" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Mastery Rings</text>
  </g>
</svg>
