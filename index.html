<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chaptr. Don't just read books. Master them.</title>
    <meta name="description" content="Chaptr turns the world's best books into interactive games, helping you finish, remember and apply what you learn with spaced repetition." />
    <meta name="theme-color" content="#0B1020" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:site_name" content="Chaptr" />
    <meta property="og:title" content="Chaptr. Don't just read books. Master them." />
    <meta property="og:description" content="Chaptr turns the world's best books into interactive games, helping you finish, remember and apply what you learn." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chaptr. Don't just read books. Master them." />
    <meta name="twitter:description" content="Chaptr turns the world's best books into interactive games, helping you finish, remember and apply what you learn." />
    <meta name="twitter:image" content="/og.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Chaptr",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "description": "Gamified book-learning web app turning books into interactive missions, spaced repetition quizzes, and mastery tracking."
    }
    </script>

    <!-- Google Fonts: Fredoka (Display) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google Identity Services (OAuth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233730A3'/><path d='M8 9a3 3 0 0 1 3-3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H11a3 3 0 0 0-3 3V9z' fill='%23FFFFFF'/><path d='M11 6a3 3 0 0 0-3 3v17a3 3 0 0 1 3-3h11' stroke='%232DD4BF' stroke-width='2' fill='none'/><circle cx='20' cy='11' r='1.5' fill='%23FACC15'/></svg>" />
    
    <!-- Ensure Dark Mode (No White Mode) -->
    <script>try{document.documentElement.classList.add('dark');localStorage.setItem('chaptr_theme','dark');}catch(e){}</script>
  </head>
  <body class="bg-[#0B1020] text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
